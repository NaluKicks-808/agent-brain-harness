name: ci
on:
  push:
  pull_request:
env:
  PYTHONUTF8: "1"
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.9"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: macos-latest, python: "3.12"}
          - {os: windows-latest, python: "3.12"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Launcher round trip (bash)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          D="$(mktemp -d)"
          bash launchers/linux/agent-brain-harness.sh init "$D" --leads build
          cd "$D"
          bash "$GITHUB_WORKSPACE/launchers/linux/agent-brain-harness.sh" launch manager --app mock --headless
          bash "$GITHUB_WORKSPACE/launchers/linux/agent-brain-harness.sh" launch lead --dept build --app mock --headless
          bash "$GITHUB_WORKSPACE/launchers/linux/agent-brain-harness.sh" inbox manager | grep "lead summary"
          bash "$GITHUB_WORKSPACE/launchers/linux/agent-brain-harness.sh" close
      # Not run locally (no PowerShell here).
      - name: Launcher round trip (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'proj'
          $l = Join-Path $env:GITHUB_WORKSPACE 'launchers\windows\agent-brain-harness.ps1'
          & $l init $d --leads build
          Set-Location $d
          & $l launch manager --app mock --headless
          & $l launch lead --dept build --app mock --headless
          if (-not (& $l inbox manager | Select-String 'lead summary')) { exit 1 }
          & $l close
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Brain tools in a fresh project (bash)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          D="$(mktemp -d)/proj"
          python harness.py init "$D"
          cd "$D"
          python -m unittest discover -s tools/tests -v
          python tools/lint.py
          python tools/find.py bike | grep sam-rivera
          python "$GITHUB_WORKSPACE/harness.py" doctor
          python "$GITHUB_WORKSPACE/harness.py" close
      # Not run locally: no PowerShell on the machine this was written on. First CI run on windows-latest is the test.
      - name: Brain tools in a fresh project (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'brainproj'
          $h = Join-Path $env:GITHUB_WORKSPACE 'harness.py'
          python $h init $d
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Set-Location $d
          python -m unittest discover -s tools/tests -v
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tools/lint.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (python tools/find.py bike | Select-String 'sam-rivera')) { exit 1 }
          python $h doctor
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python $h close
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Installer (bash)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export HOME="$(mktemp -d)"
          sh ./install.sh --dry-run --yes --claude-hook --no-path
          test -z "$(find "$HOME" -type f)"
          sh ./install.sh --yes --claude-hook --no-path
          sh ./install.sh --yes --claude-hook --no-path | grep "Nothing to do"
          PATH="$HOME/.local/bin:$PATH" agent-brain-harness doctor
          python "$HOME/.agent-brain-harness/app/install.py" --uninstall --yes
          test ! -e "$HOME/.agent-brain-harness/manifest.json"
          test -d "$HOME/agent-brain/wiki"
      # Not run locally: no PowerShell on the machine this was written on. First CI run on windows-latest is the test.
      - name: Installer (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $h = Join-Path $env:RUNNER_TEMP 'installhome'
          New-Item -ItemType Directory -Force $h | Out-Null
          $env:USERPROFILE = $h; $env:HOME = $h
          & "$env:GITHUB_WORKSPACE\install.ps1" --dry-run --yes --claude-hook --no-path
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (Get-ChildItem $h -Recurse -File) { Write-Error 'dry run wrote files'; exit 1 }
          & "$env:GITHUB_WORKSPACE\install.ps1" --yes --claude-hook --no-path
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path "$h\.agent-brain-harness\manifest.json")) { Write-Error 'install.ps1 installed nothing'; exit 1 }
          & "$env:GITHUB_WORKSPACE\install.ps1" --yes --claude-hook --no-path *> "$h\rerun.txt"
          Get-Content "$h\rerun.txt"
          if (-not (Select-String -Path "$h\rerun.txt" -Pattern 'Nothing to do' -Quiet)) { Write-Error 'rerun was not a no-op'; exit 1 }
          python "$h\.agent-brain-harness\app\install.py" --uninstall --yes
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (Test-Path "$h\.agent-brain-harness\manifest.json") { Write-Error 'manifest left'; exit 1 }
          if (-not (Test-Path "$h\agent-brain\wiki")) { Write-Error 'brain was deleted'; exit 1 }
      - name: Leak scan
        run: python scripts/leak_scan.py
  brain-tools:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Brain template tool tests (in place)
        working-directory: brain/template/tools
        run: python -m unittest discover -s tests -v
